<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Calculator</title>
</head>

<body>

    <div class="calc">

        <div id="display">
            <div id="input"></div>
            <div id="result"></div>
        </div>

        <div id="buttons">
            <button>AC</button>
            <button>(</button>
            <button>)</button>
            <button>+</button>
            <button>7</button>
            <button>8</button>
            <button>9</button>
            <button>-</button>
            <button>4</button>
            <button>5</button>
            <button>6</button>
            <button>x</button>
            <button>1</button>
            <button>2</button>
            <button>3</button>
            <button>/</button>
            <button>del</button>
            <button>0</button>
            <button>.</button>
            <button>=</button>
        </div>

    </div>

</body>

<script src="script.js"></script>

</html>
